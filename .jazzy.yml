module: ImageExtract
docset_title: ImageExtract

author: Kojiro Futamura
author_url: https://github.com/futamura
github_url: https://github.com/futamura/ImageExtract
copyright: 'Copyright © 2018 Kojiro Futamura. All rights reserved.'

min_acl: public
clean: true
readme: "README.md"
output: "docs"
documentation: "USAGE.md"
skip_undocumented: true
hide_documentation_coverage: true
# theme: fullwidth
theme: "themes/fullwidth-ex"

source_directory: Source
umbrella_header: "Source/ImageExtract.h"
xcodebuild_arguments:
  - -project
  - ../ImageExtract.xcodeproj
  - -scheme
  - ImageExtract-iOS
exclude:
  - Source/Extension.swift
custom_categories:
  - name: Classes
    children:
      - ImageExtract
  - name: Protocls
    children:
      - ImageRequestConvertible
  - name: Enumerations
    children:
      - ImageChunkSize
  - name: Guides
    children:
      - USAGE
